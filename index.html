<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>AshureEnhance</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <img class="logo" src="logo.png" alt="Logo de AshureEnhance">
    <span class="brand-name">AshureEnhance</span>
  </div>
</header>

<main>
  <p class="sub">Mejora la calidad de tus imágenes. Todo se procesa en tu navegador y tus imágenes no se suben a ningún servidor.</p>

  <div class="card">
    <div id="drop" class="drop">Arrastra una imagen aquí o haz clic para elegirla<br><small>PNG, JPG o WebP</small></div>
    <input id="file" type="file" accept="image/*" class="hidden">
    <div id="previewWrap" class="hidden" style="margin-top:16px">
      <img id="preview" class="preview" alt="Vista previa">
      <p class="status" id="info"></p>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="go" disabled>Mejorar</button>
    </div>
    <progress id="bar" value="0" max="1" class="hidden"></progress>
    <p class="status" id="status"></p>
    <button id="cancel" class="secondary hidden" style="margin-top:10px">Cancelar</button>
  </div>

  <div id="resultCard" class="card hidden">
    <canvas id="result" class="result"></canvas>
    <p class="status" id="resInfo"></p>
    <div class="row" style="margin-top:12px">
      <button id="download">Descargar</button>
    </div>
  </div>
</main>

<dialog id="opts" class="modal">
  <h2>Opciones</h2>

  <div class="group">
    <p class="lbl">Tipo de imagen</p>
    <div class="row">
      <label class="opt"><input type="radio" name="mode" value="art" checked> Arte <small>(dibujos, ilustraciones)</small></label>
      <label class="opt"><input type="radio" name="mode" value="photo"> Foto <small>(personas, animales)</small></label>
    </div>
  </div>

  <div class="group">
    <p class="lbl">Aumento de la escala</p>
    <div class="row">
      <label class="opt"><input type="radio" name="scale" value="2" checked> 2x</label>
      <label class="opt"><input type="radio" name="scale" value="4"> 4x</label>
    </div>
  </div>

  <div class="group">
    <p class="lbl">Reducción del ruido</p>
    <div class="row">
      <label class="opt"><input type="radio" name="noise" value="none" checked> Ninguno</label>
      <label class="opt"><input type="radio" name="noise" value="low"> Bajo</label>
      <label class="opt"><input type="radio" name="noise" value="medium"> Medio</label>
      <label class="opt"><input type="radio" name="noise" value="high"> Alto</label>
      <label class="opt"><input type="radio" name="noise" value="max"> El más alto</label>
    </div>
  </div>

  <div class="group">
    <p class="lbl">Formato de salida</p>
    <div class="row">
      <label class="opt"><input type="radio" name="format" value="default" checked> Predeterminado</label>
      <label class="opt"><input type="radio" name="format" value="webp"> WebP</label>
      <label class="opt"><input type="radio" name="format" value="jpg"> JPG</label>
      <label class="opt"><input type="radio" name="format" value="png"> PNG</label>
    </div>
  </div>

  <div class="actions">
    <button id="optsCancel" class="secondary" type="button">Cancelar</button>
    <button id="optsDone" type="button">Listo</button>
  </div>
</dialog>

<script src="coi-serviceworker.js"></script>
<script type="module" src="app.js?v=14"></script>
</body>
</html>
